<style>
/* Layout: one calm reading column, a slim status bar on top, one task card at a time. */
:root {
  --bg: #f3f6f5;
  --surface: #ffffff;
  --ink: #15302e;
  --muted: #4c6461;
  --line: #d3dedb;
  --accent: #0d6a6e;
  --accent-ink: #ffffff;
  --accent-soft: #e1efee;
  --warm: #a95c0c;
  --warm-soft: #fbf0e2;
  --ok: #2b7546;
  --ok-soft: #e4f2e8;
  --close: #8a5a00;
  --close-soft: #fbf3dc;
  --miss: #9b3a3a;
  --miss-soft: #f8e7e6;
  --focus: #e09a2c;
  --font-display: "DM Serif Display", Georgia, "Times New Roman", serif;
  --font-body: "Atkinson Hyperlegible", "Segoe UI", Verdana, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0e1817; --surface: #162322; --ink: #e5eeec; --muted: #9db3af; --line: #2a3c3a;
    --accent: #56b8ba; --accent-ink: #04201f; --accent-soft: #19393a;
    --warm: #e9a75a; --warm-soft: #2e2416;
    --ok: #74c792; --ok-soft: #163024; --close: #e6bb62; --close-soft: #302815;
    --miss: #eb9393; --miss-soft: #351d1d; --focus: #f0b453;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0e1817; --surface: #162322; --ink: #e5eeec; --muted: #9db3af; --line: #2a3c3a;
  --accent: #56b8ba; --accent-ink: #04201f; --accent-soft: #19393a;
  --warm: #e9a75a; --warm-soft: #2e2416;
  --ok: #74c792; --ok-soft: #163024; --close: #e6bb62; --close-soft: #302815;
  --miss: #eb9393; --miss-soft: #351d1d; --focus: #f0b453;
  color-scheme: dark;
}

[hidden] { display: none !important; }
html { font-size: 19px; }
body {
  background: var(--bg); color: var(--ink);
  font-family: var(--font-body); font-size: 1rem; line-height: 1.55;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 0 48px;
}
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg); }
.wrap { max-width: 720px; margin: 0 auto; display: flex; flex-direction: column; gap: 20px; }

/* Status bar */
.bar {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5;
  background: var(--bg); padding-block: 14px 10px; border-bottom: 1px solid var(--line);
  display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap;
}
.brand { font-family: var(--font-display); font-size: 1.45rem; line-height: 1; letter-spacing: .01em; }
.brand small { font-family: var(--font-body); font-size: .72rem; color: var(--muted); letter-spacing: .08em; text-transform: uppercase; margin-left: 8px; }
.bar-right { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.pill {
  font-size: .8rem; padding: 4px 12px; border-radius: 999px; background: var(--accent-soft); color: var(--ink);
  font-variant-numeric: tabular-nums; white-space: nowrap;
}
.pill.warn { background: var(--close-soft); color: var(--close); font-weight: 700; }

.banner { border-radius: 10px; padding: 12px 16px; background: var(--close-soft); color: var(--ink); border: 1px solid var(--line); }

/* Text */
h1, h2, h3 { font-family: var(--font-display); font-weight: 400; text-wrap: balance; margin: 0; line-height: 1.15; }
h1 { font-size: 2.6rem; }
h2 { font-size: 1.8rem; }
h3 { font-size: 1.25rem; }
p { margin: 0; max-width: 62ch; }
.muted { color: var(--muted); }
.eyebrow { font-size: .75rem; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); font-weight: 700; }
.stack { display: flex; flex-direction: column; gap: 14px; }
.stack-lg { display: flex; flex-direction: column; gap: 24px; }
.row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }

/* Card */
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 24px; display: flex; flex-direction: column; gap: 18px; }
@media (max-width: 480px) { .card { padding: 18px; } h1 { font-size: 2.1rem; } }

/* Buttons */
button, .btn {
  font: inherit; font-size: 1rem; cursor: pointer; border-radius: 10px; min-height: 52px; padding: 10px 20px;
  border: 2px solid var(--accent); background: var(--surface); color: var(--accent); font-weight: 700;
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
}
button.primary { background: var(--accent); color: var(--accent-ink); }
button.quiet { border-color: var(--line); color: var(--ink); font-weight: 400; }
button:hover { filter: brightness(1.05); }
button:disabled { opacity: .5; cursor: default; }
button:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible, summary:focus-visible {
  outline: 3px solid var(--focus); outline-offset: 2px;
}
button svg { width: 22px; height: 22px; flex: none; }
button.mic { min-height: 64px; font-size: 1.05rem; }
button.mic.listening { background: var(--miss); border-color: var(--miss); color: var(--surface); }

/* Onboarding choices */
.choices { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 10px; }
.choice { justify-content: flex-start; text-align: left; border-color: var(--line); color: var(--ink); font-weight: 400; min-height: 60px; }
.choice[aria-pressed="true"] { border-color: var(--accent); background: var(--accent-soft); font-weight: 700; }
.steps { display: flex; gap: 6px; }
.steps span { height: 6px; flex: 1; border-radius: 3px; background: var(--line); }
.steps span.on { background: var(--accent); }

/* Phrase */
.phrase { font-family: var(--font-display); font-size: 2.5rem; line-height: 1.12; text-wrap: balance; }
@media (max-width: 480px) { .phrase { font-size: 2rem; } }
.say { font-size: 1.05rem; color: var(--muted); letter-spacing: .02em; }
.meaning { font-size: 1.15rem; }
.tip { background: var(--warm-soft); border-radius: 10px; padding: 12px 16px; display: flex; flex-direction: column; gap: 4px; }
.tip .eyebrow { color: var(--warm); }
.prompt-en { font-size: 1.5rem; font-family: var(--font-display); }

/* Answer */
form.answer { display: flex; gap: 10px; flex-wrap: wrap; }
form.answer input {
  flex: 1 1 260px; min-width: 0; min-height: 56px; font: inherit; font-size: 1.15rem; padding: 10px 14px;
  border-radius: 10px; border: 2px solid var(--line); background: var(--bg); color: var(--ink);
}
.heard { color: var(--muted); font-style: italic; }
.feedback { border-radius: 10px; padding: 14px 16px; display: flex; flex-direction: column; gap: 8px; }
.feedback.right { background: var(--ok-soft); }
.feedback.right strong { color: var(--ok); }
.feedback.close { background: var(--close-soft); }
.feedback.close strong { color: var(--close); }
.feedback.wrong { background: var(--miss-soft); }
.feedback.wrong strong { color: var(--miss); }
.feedback.info { background: var(--accent-soft); }
.words { font-family: var(--font-display); font-size: 1.5rem; display: flex; flex-wrap: wrap; gap: 4px 10px; }
.words mark { background: none; color: var(--miss); text-decoration: underline; text-decoration-thickness: 2px; text-underline-offset: 4px; }

.foot { display: flex; justify-content: space-between; gap: 10px; flex-wrap: wrap; border-top: 1px solid var(--line); padding-top: 16px; }

/* Grammar examples */
.examples { display: flex; flex-direction: column; gap: 8px; }
.ex { display: grid; grid-template-columns: auto 1fr; gap: 4px 14px; align-items: center; padding: 10px 0; border-bottom: 1px solid var(--line); }
.ex:last-child { border-bottom: 0; }
.ex .es { font-family: var(--font-display); font-size: 1.3rem; }
.ex .en { grid-column: 2; color: var(--muted); }
.ex button { grid-row: span 2; min-height: 44px; width: 48px; padding: 0; }

/* Lesson path */
.path { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; }
.path li { display: grid; grid-template-columns: 30px 1fr auto; gap: 12px; align-items: center; padding: 10px 0; border-bottom: 1px solid var(--line); }
.path li:last-child { border-bottom: 0; }
.dot { width: 24px; height: 24px; border-radius: 50%; border: 2px solid var(--line); display: grid; place-items: center; font-size: .75rem; }
.path li.done .dot { background: var(--ok); border-color: var(--ok); color: var(--surface); }
.path li.next .dot { border-color: var(--accent); background: var(--accent-soft); }
.path .t { font-weight: 700; }
.path .s { color: var(--muted); font-size: .88rem; }

/* Summary table */
table.answers { width: 100%; border-collapse: collapse; }
table.answers td { padding: 8px 0; border-bottom: 1px solid var(--line); vertical-align: top; }
table.answers td:first-child { color: var(--muted); padding-right: 16px; width: 42%; }

/* Settings / ask */
details.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; }
details.panel > summary { cursor: pointer; padding: 16px 20px; font-weight: 700; list-style: none; display: flex; justify-content: space-between; align-items: center; }
details.panel > summary::-webkit-details-marker { display: none; }
details.panel > summary::after { content: "+"; font-size: 1.4rem; color: var(--muted); }
details.panel[open] > summary::after { content: "–"; }
details.panel .inner { padding: 0 20px 20px; display: flex; flex-direction: column; gap: 16px; }
label.field { display: flex; flex-direction: column; gap: 6px; font-weight: 700; }
label.field span.help { font-weight: 400; color: var(--muted); font-size: .88rem; }
select, textarea, input[type="range"] { font: inherit; }
select, textarea { padding: 10px 12px; border-radius: 10px; border: 2px solid var(--line); background: var(--bg); color: var(--ink); min-height: 48px; max-width: 100%; }
textarea { min-height: 90px; resize: vertical; }
input[type="range"] { accent-color: var(--accent); width: 100%; max-width: 360px; }
.answer-out { white-space: pre-wrap; background: var(--accent-soft); border-radius: 10px; padding: 14px 16px; }

.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
@media (prefers-reduced-motion: no-preference) {
  .card { animation: rise .25s ease-out both; }
  @keyframes rise { from { transform: translateY(6px); } to { transform: none; } }
}
</style>

<div class="wrap">
  <header class="bar">
    <div class="brand">Habla Cubano<small>Spanish tutor</small></div>
    <div class="bar-right">
      <span class="pill" id="where" hidden></span>
      <span class="pill" id="clock" hidden></span>
    </div>
  </header>

  <div class="banner" id="banner" role="status" hidden></div>

  <main id="stage" aria-live="polite"></main>

  <details class="panel" id="askPanel" hidden>
    <summary>Ask your tutor a question</summary>
    <div class="inner">
      <p class="muted">Ask anything in English. For example: “Why is it buenas tardes and not buenos tardes?”</p>
      <label class="field" for="askBox">Your question
        <textarea id="askBox"></textarea>
      </label>
      <div class="row">
        <button class="primary" id="askBtn" type="button">Ask</button>
        <button class="quiet" id="askStop" type="button" hidden>Stop</button>
      </div>
      <div class="answer-out" id="askOut" hidden></div>
    </div>
  </details>

  <details class="panel" id="settingsPanel" hidden>
    <summary>Settings and lessons</summary>
    <div class="inner">
      <label class="field" for="rate">Speaking speed
        <span class="help">Slower is fine. You can speed up later.</span>
        <input type="range" id="rate" min="0.5" max="1" step="0.05">
      </label>
      <label class="field" for="voiceSel">Spanish voice
        <span class="help">Voices come from your device. Latin American voices are closest to Cuban.</span>
        <select id="voiceSel"></select>
      </label>
      <label class="field" for="modeSel">Practice style
        <select id="modeSel">
          <option value="text">Text: read and type</option>
          <option value="voice">Voice: listen and speak</option>
          <option value="both">Both</option>
        </select>
      </label>
      <div class="stack">
        <div class="eyebrow">Go to a lesson</div>
        <div class="row" id="jump"></div>
      </div>
      <div class="row">
        <button class="quiet" id="redoAnswers" type="button">Change my answers</button>
        <button class="quiet" id="endNow" type="button">End today’s session</button>
      </div>
    </div>
  </details>
</div>

      { es: "Señor", en: "Sir / Mr.", say: "seh-NYOR", note: "The ñ sounds like “ny” in “canyon”." },

        h("h2", null, "Let’s repeat the hard ones."),
        h("p", null, `${hardHere.length === 1 ? "One phrase was" : hardHere.length + " phrases were"} tricky. We will go through ${hardHere.length === 1 ? "it" : "them"} again, slowly.`),
        h("div", { class: "row" }, h("button", { class: "primary", type: "button", "data-autofocus": true, onclick: advance }, "Start the review"))));
    }
    case "learn":
    case "quiz":
      return renderPractice(step, learnIndex, learnCount);
    case "done":
      return renderLessonDone();
  }
}

function renderGrammar(L) {
  const g = L.grammar;
  show(h("section", { class: "card" },
    h("div", { class: "eyebrow" }, "Grammar in plain English"),
    h("h2", null, g.title),
    g.body.map(t => h("p", null, t)),
    h("div", { class: "examples" }, g.examples.map(ex => {
      const b = h("button", { type: "button", class: "quiet", "aria-label": `Hear ${ex.es}`, onclick: () => speak(ex.es) });
      b.innerHTML = ICON.speaker;
      return h("div", { class: "ex" }, b, h("span", { class: "es", lang: "es" }, ex.es), h("span", { class: "en" }, ex.en));
    })),
    h("div", { class: "row" }, h("button", { class: "primary", type: "button", "data-autofocus": true, onclick: advance }, "Got it. Continue"))));
}

function renderPractice(step, idx, count) {
  const item = itemAt(step.key);
  const isQuiz = step.type === "quiz";
  const showMic = usesVoice();
  const label = step.warm ? "Warm-up" : step.review ? "Once more" : isQuiz ? "Quick check" : `Phrase ${idx + 1} of ${count}`;

  const phraseEl = h("div", { class: "phrase", lang: "es", hidden: isQuiz || null }, item.es);
  const sayEl = h("div", { class: "say", hidden: isQuiz || null }, `Say: ${item.say}`);
  const tipEl = item.note ? h("div", { class: "tip", hidden: isQuiz || null },
    h("div", { class: "eyebrow" }, item.cuban ? "Cuban tip" : "Tip"), h("p", null, item.note)) : null;
  const feedback = h("div", { class: "feedback", hidden: true, role: "status" });
  const heard = h("p", { class: "heard", hidden: true });
  const input = h("input", { id: "answerBox", type: "text", lang: "es", autocomplete: "off", autocapitalize: "off", spellcheck: "false",
    placeholder: showMic ? "Or type it here" : "Type it in Spanish", "aria-label": "Your answer in Spanish" });
  const checkBtn = h("button", { class: "primary", type: "submit" }, "Check");
  const nextBtn = h("button", { class: "primary", type: "button", hidden: true, onclick: advance }, "Next");
  const hardBtn = h("button", { class: "quiet", type: "button", onclick: markHard }, "This one is hard");
  const skipBtn = h("button", { class: "quiet", type: "button", onclick: () => { addHard(step.key); advance(); } }, isQuiz ? "Show me and move on" : "Skip for now");

  const hearBtn = iconBtn("speaker", "Hear it", () => speak(item.es), "");
  const slowBtn = iconBtn("slow", "Slower", () => speak(item.es, { slow: true }), "");
  if (isQuiz) { hearBtn.hidden = true; slowBtn.hidden = true; }
  const hintBtn = isQuiz ? h("button", { class: "quiet", type: "button", onclick: () => {
    const first = item.es.split(" ")[0];
    setFeedback("info", "Hint", `It starts with “${first}”.`);
    hintBtn.disabled = true;
  } }, "Give me a hint") : null;

  const micBtn = showMic ? iconBtn("mic", "Tap and speak", onMic, "mic") : null;
  const micNote = h("p", { class: "muted", hidden: true });

  const form = h("form", { class: "answer", onsubmit: e => {
    e.preventDefault();
    if (state.answered) { advance(); return; }
    const val = input.value.trim();
    if (!val) { setFeedback("info", "Your turn", showMic ? "Tap the microphone and say it, or type it in the box." : "Type the phrase in the box, then press Check."); return; }
    check([val], false);
  } }, input, checkBtn);

  function setFeedback(kind, title, ...body) {
    feedback.className = "feedback " + kind;
    feedback.replaceChildren(h("strong", null, title), ...body.map(b => typeof b === "string" ? h("p", null, b) : b));
    feedback.hidden = false;
  }

  function addHard(key) {
    state.sessionHard.add(key);
    if (!state.progress.hard.includes(key)) { state.progress.hard.push(key); saveProgress(); }
  }

  function markHard() {
    addHard(step.key);
    if (!step.review) {
      const at = Math.min(state.pos + 3, state.queue.length - 1);
      state.queue.splice(at, 0, { type: "learn", key: step.key, review: true });
    }
    hardBtn.disabled = true;
    setFeedback("info", "No problem.", "We will come back to this one in a few minutes. Let’s hear it slowly now.");
    if (isQuiz) reveal();
    speak(item.es, { slow: true });
  }

  function reveal() {
    phraseEl.hidden = false; sayEl.hidden = false; if (tipEl) tipEl.hidden = false;
    hearBtn.hidden = false; slowBtn.hidden = false;
  }

  function finish() {
    state.answered = true;
    nextBtn.hidden = false; checkBtn.hidden = true; skipBtn.hidden = true;
    if (micBtn) micBtn.hidden = true;
    nextBtn.focus();
  }

  function onMic() {
    if (micBtn.classList.contains("listening")) { stopListening(); return; }
    micBtn.classList.add("listening");
    micBtn.lastChild.textContent = "Listening… tap to stop";
    heard.hidden = true;
    listen({
      onInterim: t => { heard.hidden = false; heard.textContent = `I hear: “${t}”`; },
      onFinal: alts => { resetMic(); heard.hidden = false; heard.textContent = `I heard: “${alts[0]}”`; check(alts, true); },
      onFail: why => {
        resetMic();
        if (why === "blocked" || why === "unsupported") {
          micBtn.hidden = true;
          micNote.hidden = false;
          micNote.textContent = why === "blocked"
            ? "Voice answers are not allowed in this window. Please type your answer. Voice answers work when this page is opened directly in Chrome, Edge, or Safari."
            : "This browser cannot hear speech. Please type your answer. Chrome, Edge, and Safari can listen.";
          input.focus();
        } else if (why === "no-speech") {
          setFeedback("info", "I didn’t catch that.", "Tap the microphone, wait a moment, then speak clearly. Or type it.");
        } else {
          setFeedback("info", "The microphone stopped.", "Please try again, or type your answer.");
        }
      }
    });
  }
  function resetMic() { micBtn.classList.remove("listening"); micBtn.lastChild.textContent = "Tap and speak"; }

  function check(candidates, viaVoice) {
    let r = { grade: "wrong", score: -1 };
    let said = candidates[0];
    for (const c of candidates) { const g = grade(c, item); if (g.score > r.score) { r = g; said = c; } if (g.grade === "right") break; }
    state.attempts++;
    if (r.grade === "right") {
      const praise = ["Muy bien. That’s right.", "¡Excelente! Well done.", "Perfecto, Paul.", "¡Eso es! That’s it."][Math.floor(Math.random() * 4)];
      const extra = [];
      if (state.missedThis) extra.push("You worked through it. That is how learning happens.");
      if (r.accentNote && !viaVoice) extra.push(`One small thing: it is written “${r.target}”. Accent marks are optional when you type here.`);
      if (isQuiz) { reveal(); extra.unshift(h("div", { class: "words", lang: "es" }, item.es)); }
      setFeedback("right", praise, ...extra);
      if (usesVoice()) speak("¡Muy bien!");
      if (state.attempts === 1) state.stats.firstTry++;
      state.stats.practiced++;
      if (step.review && state.attempts === 1) {
        state.progress.hard = state.progress.hard.filter(k => k !== step.key); saveProgress();
      }
      finish();
      return;
    }
    state.missedThis = true;
    const heardLine = viaVoice ? `I heard “${said}”.` : null;
    if (r.grade === "close" && state.attempts >= 3) {
      addHard(step.key); reveal();
      setFeedback("close", "Close enough for today.", "You are almost there. We will polish this one in the review.", wordMarks(said, item.es));
      state.stats.practiced++; finish(); return;
    } else if (r.grade === "close") {
      setFeedback("close", "Very close.", ...[heardLine, "Look at the underlined word. Then try once more."].filter(Boolean), wordMarks(said, item.es));
      if (isQuiz) reveal();
      if (usesVoice()) speak(item.es, { slow: true });
    } else if (state.attempts === 1) {
      setFeedback("wrong", "Not quite yet. That is normal.", ...[heardLine, isQuiz ? "Here is the phrase. Listen, then try again." : "Listen once more, slowly. Then try again."].filter(Boolean));
      if (isQuiz) reveal();
      speak(item.es, { slow: true });
    } else {
      addHard(step.key);
      reveal();
      setFeedback("wrong", "Let’s look at it together.",
        wordMarks(said, item.es),
        `Say it in small pieces: ${item.say}.`,
        "I added this phrase to your review list. We will practice it again soon.");
      speak(item.es, { slow: true });
      if (state.attempts >= 3) { state.stats.practiced++; finish(); }
    }
    input.select();
  }

  const card = h("section", { class: "card" },
    h("div", { class: "eyebrow" }, label),
    isQuiz ? h("div", { class: "stack" }, h("p", { class: "muted" }, "How do you say this in Spanish?"), h("div", { class: "prompt-en" }, `“${item.en}”`)) : null,
    phraseEl, sayEl,
    isQuiz ? null : h("div", { class: "meaning" }, item.en),
    h("div", { class: "row" }, hearBtn, slowBtn, hintBtn),
    tipEl,
    h("div", { class: "stack" },
      h("p", { class: "muted" }, isQuiz ? (showMic ? "Say it or type it." : "Type it.") : (showMic ? "Now you say it. Speak, or type it." : "Now type it. Accent marks are optional.")),
      micBtn, micNote, heard, form),
    feedback,
    h("div", { class: "foot" }, h("div", { class: "row" }, hardBtn, skipBtn), nextBtn)
  );
  show(card);
  if (!micBtn) input.focus({ preventScroll: true }); else micBtn.focus({ preventScroll: true });
  if (usesVoice() && !isQuiz) setTimeout(() => speak(item.es), 250);
  state.current = { item, lesson: LESSONS[state.lesson] };
}

function renderLessonDone() {
  const L = LESSONS[state.lesson];
  if (!state.progress.done.includes(L.id)) { state.progress.done.push(L.id); saveProgress(); }
  const next = state.lesson + 1 < LESSONS.length ? state.lesson + 1 : null;
  const left = remaining();
  const lowTime = left < 5 * 60000;
  const hardHere = state.progress.hard.filter(k => k.startsWith(state.lesson + "-")).map(itemAt);
  const actions = [];
  if (next !== null && !state.timeUp && !lowTime) actions.push(h("button", { class: "primary", type: "button", "data-autofocus": true, onclick: () => startLesson(next) }, `Next: ${LESSONS[next].en}`));
  actions.push(h("button", { class: actions.length ? "quiet" : "primary", type: "button", "data-autofocus": !actions.length || null, onclick: endSession }, "Finish for today"));
  show(h("section", { class: "card" },
    h("div", { class: "eyebrow" }, "Lesson complete"),
    h("h2", null, `¡Muy bien, Paul! You finished “${L.en}”.`),
    hardHere.length ? h("p", null, "These are on your review list. I will bring them back next time:") : h("p", null, "Nothing is on your review list from this lesson. Excellent."),
    hardHere.length ? phraseList(hardHere) : null,
    lowTime && next !== null && !state.timeUp ? h("p", { class: "muted" }, "There are only a few minutes left today. This is a good place to stop.") : null,
    next === null ? h("p", null, "You have finished all five lessons. Next time, pick any lesson in Settings to practice again.") : null,
    h("div", { class: "row" }, actions)));
  if (usesVoice()) speak("¡Muy bien, Paul!");
}

function phraseList(items) {
  return h("div", { class: "examples" }, items.filter(Boolean).map(it => {
    const b = h("button", { type: "button", class: "quiet", "aria-label": `Hear ${it.es}`, onclick: () => speak(it.es, { slow: true }) });
    b.innerHTML = ICON.speaker;
    return h("div", { class: "ex" }, b, h("span", { class: "es", lang: "es" }, it.es), h("span", { class: "en" }, `${it.en} · ${it.say}`));
  }));
}

function endSession() {
  if (state.ended) return;
  state.ended = true;
  stopListening();
  const mins = state.sessionStart ? Math.max(1, Math.round((Date.now() - state.sessionStart) / 60000)) : 0;
  const hard = [...state.sessionHard].map(itemAt);
  setWhere(""); panels(false); tick();
  $("#banner").hidden = true;
  const next = nextLessonIndex();
  show(h("section", { class: "card" },
    h("div", { class: "eyebrow" }, "Session complete"),
    h("h1", null, "¡Hasta luego, Paul!"),
    h("p", null, `You practiced for about ${Math.min(mins, 20)} minutes and worked on ${state.stats.practiced} phrases. You got ${state.stats.firstTry} right on the first try.`),
    hard.length ? h("p", null, "Phrases to listen to before next time:") : null,
    hard.length ? phraseList(hard) : null,
    h("p", null, `Next time we start with “${LESSONS[next].en}”.`),
    h("div", { class: "row" }, h("button", { class: "primary", type: "button", "data-autofocus": true, onclick: newSession }, "Start a new session"))),
    pathCard(next));
  speak("¡Hasta luego, Paul!");
}
function newSession() {
  store.del("hc-start", true);
  Object.assign(state, { sessionStart: null, warned: false, timeUp: false, ended: false, sessionHard: new Set(), stats: { practiced: 0, firstTry: 0 } });
  $("#banner").hidden = true;
  renderPlan();
}

/* ---------- Settings ---------- */
function fillVoiceSelect() {
  const sel = $("#voiceSel");
  const list = spanishVoices();
  sel.replaceChildren(...(list.length ? list.map(v => h("option", { value: v.voiceURI }, `${v.name} (${v.lang})`)) : [h("option", { value: "" }, "No Spanish voice found on this device")]));
  sel.value = list.find(v => v.voiceURI === state.settings.voiceURI)?.voiceURI || list[0]?.voiceURI || "";
}
function syncSettingsUI() {
  $("#rate").value = state.settings.rate;
  if (state.profile) $("#modeSel").value = state.profile.mode;
  $("#jump").replaceChildren(...LESSONS.map((l, i) => h("button", { type: "button", class: "quiet", onclick: () => { $("#settingsPanel").open = false; if (state.ended) newSession(); startLesson(i); } }, `${i + 1}. ${l.en}`)));
}
$("#rate").addEventListener("change", e => { state.settings.rate = Number(e.target.value); saveSettings(); speak("Mucho gusto."); });
$("#voiceSel").addEventListener("change", e => { state.settings.voiceURI = e.target.value; saveSettings(); speak("Hola, Paul. Mucho gusto."); });
$("#modeSel").addEventListener("change", e => {
  state.profile.mode = e.target.value; store.set("hc-profile", state.profile, true); store.set("hc-profile-last", state.profile);
  const step = state.queue[state.pos];
  if (step && (step.type === "learn" || step.type === "quiz") && !state.ended) renderStep();
});
$("#redoAnswers").addEventListener("click", () => { $("#settingsPanel").open = false; state.draft = { ...state.profile }; renderQuestion(0); });
$("#endNow").addEventListener("click", () => { $("#settingsPanel").open = false; endSession(); });

/* ---------- Ask the tutor (Claude, when available) ---------- */
let sampleFn = null;
let askCtl = null;
if (window.claude && typeof window.claude.use === "function") {
  window.claude.use("sample").then(fn => { sampleFn = fn; if (fn && !$("#settingsPanel").hidden) $("#askPanel").hidden = false; }).catch(() => {});
}
$("#askBtn").addEventListener("click", async () => {
  const q = $("#askBox").value.trim();
  const out = $("#askOut");
  if (!q || !sampleFn) return;
  const p = state.profile || {};
  const cur = state.current;
  const prompt = [
    "You are a patient, respectful Spanish tutor. Your learner is Paul, an English speaker in the age group " + (LABEL.age[p.age] || "60 to 74") + ".",
    "He is learning Cuban Spanish for business. His level: " + (LABEL.level[p.level] || "none") + ".",
    "Answer in plain English with short sentences. Be warm and encouraging, never condescending.",
    "Explain grammar simply. When useful, mention how Cubans say it. Put Spanish words in quotes with the English meaning.",
    "Keep it under 130 words. No headings, no tables, no markdown symbols.",
    cur ? `Current lesson: ${cur.lesson.en}. Current phrase: "${cur.item.es}" (${cur.item.en}).` : "",
    "Paul's question: " + q
  ].join("\n");
  askCtl = new AbortController();
  $("#askBtn").disabled = true; $("#askStop").hidden = false;
  out.hidden = false; out.textContent = "Thinking…";
  try {
    await sampleFn(prompt, { signal: askCtl.signal, cache: false, onText: ({ text }) => { out.textContent = text; } });
  } catch (e) {
    if (e?.code === "cancelled") out.textContent = e.text || "Stopped.";
    else if (e?.code === "not_granted" || e?.code === "sampling_disabled" || e?.code === "capability_disabled") { out.textContent = "The tutor can’t answer questions in this view."; }
    else if (e?.code === "rate_limited") out.textContent = "Too many questions at once. Please wait a minute and ask again.";
    else out.textContent = (e?.text ? e.text + "\n\n" : "") + "The answer was interrupted. Please press Ask again.";
  } finally {
    $("#askBtn").disabled = false; $("#askStop").hidden = true;
  }
});
$("#askStop").addEventListener("click", () => askCtl?.abort());

/* ---------- Start ---------- */
syncSettingsUI();
if (state.profile && state.sessionStart) { startLesson(nextLessonIndex()); }
else if (state.profile) renderPlan();
else renderWelcome();
})();
</script>
